windowrule=opacity 0.80 0.70, match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$
windowrule=opacity 0.70 0.70, match:class ^([Ss]team)$
windowrule=opacity 0.70 0.70, match:class ^(steamwebhelper)$
windowrule=opacity 0.70 0.70, match:class ^(Spotify)$
windowrule=opacity 0.70 0.70, match:initial_title ^(Spotify Free)$
windowrule=opacity 0.90 0.90, float on, match:class ^(com.github.rafostar.Clapper)$
windowrule=opacity 0.80 0.80, match:class ^(com.github.tchx84.Flatseal)$
windowrule=opacity 0.80 0.80, match:class ^(hu.kramo.Cartridges)$
windowrule=opacity 0.80 0.80, match:class ^(com.obsproject.Studio)$
windowrule=opacity 0.80 0.80, match:class ^(gnome-boxes)$
windowrule=opacity 0.80 0.80, match:class ^(discord)$
windowrule=opacity 0.80 0.80, match:class ^(WebCord)$
windowrule=opacity 0.80 0.80, match:class ^(ArmCord)$
windowrule=opacity 0.80 0.80, float on, match:class ^(app.drey.Warp)$
windowrule=opacity 0.80 0.80, float on, match:class ^(net.davidotek.pupgui2)$
windowrule=opacity 0.80 0.80, float on, match:class ^(yad)$
windowrule=opacity 0.80 0.80, float on, match:class ^(Signal)$
windowrule=opacity 0.80 0.80, float on, match:class ^(io.github.alainm23.planify)$
windowrule=opacity 0.80 0.80, float on, match:class ^(io.gitlab.theevilskeleton.Upscaler)$
windowrule=opacity 0.80 0.80, float on, match:class ^(com.github.unrud.VideoDownloader)$
windowrule=opacity 0.80 0.80, float on, match:class ^(io.gitlab.adhami3310.Impression)$
windowrule=opacity 0.80 0.80, float on, match:class ^(io.missioncenter.MissionCenter)$
windowrule=opacity 0.80 0.80, match:class ^(io.github.flattool.Warehouse)$
windowrule=float on, match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$
windowrule=float on, match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$
windowrule=float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule=float on, match:class ^(firefox)$, match:title ^(Library)$
windowrule=float on, match:class ^(kitty)$, match:title ^(top)$
windowrule=float on, match:class ^(kitty)$, match:title ^(btop)$
windowrule=float on, match:class ^(kitty)$, match:title ^(htop)$
windowrule=float on, match:class ^(vlc)$
windowrule=float on, match:class ^(eog)$
windowrule=float on, size 400 225, match:class ^(custom-browserprofiles)$
windowrule=float on, size 1050 200, match:class ^(custom-changeAudioOutput)$
windowrule=float on, size 400 175, match:class ^(custom-obsidianvaults)$
windowrule=float on, size 600 600, match:initial_class ^(custom-pomodoro)$
windowrule=float on, size 1500 800, match:initial_class ^(custom-bottom)$

workspace=1, layout:master
workspace=2, layout:scrolling, layoutopt:direction:right
workspace=name:special, layout:scrolling

xwayland {
  force_zero_scaling=true
}
splash=true
